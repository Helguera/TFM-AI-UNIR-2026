{% extends "base.html" %}

{% block title %}Login - Surveillance System{% endblock %}

{% block body %}
<div class="login-container">
    <div class="login-card">
        <div class="login-logo">
            <div class="logo-icon">🎯</div>
            <h1>Surveillance<span>HQ</span></h1>
            <p style="color: var(--text-secondary); margin-top: 0.5rem;">Sistema de Videovigilancia Inteligente</p>
        </div>

        <div id="error-message" class="alert-message error" style="display: none;"></div>

        <form id="login-form" class="login-form">
            <div class="form-group">
                <label class="form-label" for="username">Usuario</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="Introduce tu usuario" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Contraseña</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="Introduce tu contraseña" required>
            </div>

            <button type="submit" class="btn btn-primary">
                <span>Iniciar Sesión</span>
            </button>
        </form>

        <div class="login-footer">
            ¿No tienes cuenta? <a href="/register">Regístrate aquí</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const formData = new URLSearchParams();
    formData.append('username', document.getElementById('username').value);
    formData.append('password', document.getElementById('password').value);
    
    try {
        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: formData
        });
        
        if (response.ok) {
            window.location.href = '/dashboard';
        } else {
            const data = await response.json();
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = data.detail || 'Error al iniciar sesión';
            errorDiv.style.display = 'flex';
        }
    } catch (error) {
        const errorDiv = document.getElementById('error-message');
        errorDiv.textContent = 'Error de conexión';
        errorDiv.style.display = 'flex';
    }
});
</script>
{% endblock %}
